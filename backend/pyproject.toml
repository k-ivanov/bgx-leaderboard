[project]
name = "bgx-navigation-dashboard"
version = "0.2.0"
description = "BGX Hard Enduro Championship Dashboard — FastAPI backend"
requires-python = ">=3.12"
readme = "src/README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.0.0",
    "pydantic>=2.5",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
