name: CI

on:
  push:
    branches: [main, refactor/fastapi-vue]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bgx
          POSTGRES_PASSWORD: bgx
          POSTGRES_DB: bgx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
        run: pytest -q

  frontend:
    name: Frontend (build + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Astro check (typecheck + lint)
        working-directory: frontend
        # `astro check` walks every .astro file. Allow it to fail
        # without breaking CI for now — frontend is in active flux.
        run: npm run check || true

      - name: Build (also runs sitemap generator)
        working-directory: frontend
        env:
          SITE: https://bgx.example.com
        run: npm run build

  types-drift:
    name: API types drift check
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bgx
          POSTGRES_PASSWORD: bgx
          POSTGRES_DB: bgx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
        run: alembic upgrade head

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
          STATS_PASSWORD: letmein
          ADMIN_PASSWORD: letmein
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 5001 > /tmp/uvicorn.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:5001/health && break; sleep 1; done

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Check types drift
        env:
          STATS_PASSWORD: letmein
        working-directory: frontend
        run: |
          npm run generate:api-types
          if ! git diff --quiet -- src/lib/api.openapi.ts; then
            echo "::error::api.openapi.ts is out of sync with the backend schema. Run 'make types' locally and commit."
            git --no-pager diff -- src/lib/api.openapi.ts
            exit 1
          fi
