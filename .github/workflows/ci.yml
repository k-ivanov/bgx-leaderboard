name: CI

on:
  push:
    branches: [main, refactor/fastapi-vue]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bgx
          POSTGRES_PASSWORD: bgx
          POSTGRES_DB: bgx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bgx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
        run: alembic upgrade head

      - name: Pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bgx:bgx@localhost:5432/bgx
        run: pytest -q

  frontend:
    name: Frontend (build + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Astro check (typecheck + lint)
        working-directory: frontend
        # `astro check` walks every .astro file. Allow it to fail
        # without breaking CI for now — frontend is in active flux.
        run: npm run check || true

      - name: Build (also runs sitemap generator)
        working-directory: frontend
        env:
          SITE: https://bgx.example.com
        run: npm run build
