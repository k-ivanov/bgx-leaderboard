[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgx-dashboard-django"
version = "0.1.0"
description = "BGX Hard Enduro Championship Dashboard — Django 6 + Django Ninja rewrite (side-by-side with the frozen FastAPI backend/ until I1)"
requires-python = ">=3.12"

# Pinned to the versions verified in F1. The frozen FastAPI app keeps its own
# backend/pyproject.toml — this is a SEPARATE, side-by-side dependency set.
dependencies = [
    "django>=6.0,<7.0",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "gunicorn>=21.0.0",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "dj-database-url>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "httpx>=0.27",
]

# Flat layout: explicitly scope package discovery so `pip install -e .` and the
# container build resolve the Django packages (and their subpackages:
# core.migrations, core.management.commands, api.schemas, …). Without this,
# setuptools auto-discovery fails on the multi-top-level flat layout.
[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "api*", "redirects*"]

[tool.pytest.ini_options]
# pytest-django harness. DJANGO_SETTINGS_MODULE wires Django; DJANGO_ALLOW_NO_DB
# lets the scaffold-level suite run without a live Postgres (F2 brings real
# model tests + the prod-clone DB fixture). testpaths/pythonpath scoped to
# django_app so the frozen backend/ test suite is never collected here.
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Two-tier verification (orchestrator decision B, 2026-05-17). Tier-1 (fast,
# no DB) gates every serial slice:  pytest -m "not parity"
# Tier-2 (needs seeded Postgres) runs at integration checkpoints + the hard
# I1 cutover gate:                  pytest -m parity
# Tests are auto-tagged 'parity' by conftest.py when they use the seeded_orm
# or parity_rig fixtures — no per-test annotation needed.
markers = [
    "parity: requires a seeded Postgres (Tier-2 — integration checkpoints + I1, not the per-slice gate)",
]
